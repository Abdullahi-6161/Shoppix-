name: Build Shoppix APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract Shoppix ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -iname '*.zip' | head -n 1)
          mkdir project
          unzip -q "$ZIP_FILE" -d project

      - name: Locate Flutter project
        run: |
          PROJECT_DIR=$(dirname "$(find project -name pubspec.yaml | head -n 1)")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android project
        run: |
          cd "$PROJECT_DIR"
          flutter create --platforms=android .

      - name: Get dependencies
        run: |
          cd "$PROJECT_DIR"
          flutter pub get

      - name: Build Shoppix APK
        run: |
          cd "$PROJECT_DIR"
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Shoppix-APK
          path: project/**/build/app/outputs/flutter-apk/app-release.apk
